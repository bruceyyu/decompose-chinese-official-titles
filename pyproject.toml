[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "official-title-decomposition"
version = "0.2.0"
description = "Institutional decomposition of Qing and Joseon official titles with separate component ranks"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
authors = [{name = "Yue Yu"}, {name = "Jun Chen"}, {name = "Michael Yan Hon Chung"}, {name = "Cameron Campbell"}]

[project.optional-dependencies]
inference = ["torch>=2.6,<3", "transformers==5.5.4", "peft==0.21.2", "accelerate==1.15.0", "safetensors>=0.5,<1", "huggingface-hub>=0.34,<2"]
demo = ["gradio==6.30.0"]
analysis = ["numpy>=1.24,<3", "pandas>=1.5,<4", "scipy>=1.10,<2", "matplotlib>=3.8,<4"]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "requests>=2.32,<3"]

[project.scripts]
official-titles = "title_decomposition.cli:main"
official-titles-demo = "title_decomposition.demo:main"

[project.urls]
Repository = "https://github.com/bruceyyu/decompose-chinese-official-titles"
Data = "https://doi.org/10.7910/DVN/GMQWVZ"
"Parsed titles" = "https://dataverse.harvard.edu/file.xhtml?fileId=14356735&version=12.0"
Preprint = "https://osf.io/preprints/socarxiv/eg87f_v1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
title_ranks = ["data/*.csv"]

